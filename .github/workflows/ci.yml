name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile source
        run: python -m compileall src tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic smoke test
        run: python -m src.cli data/synthetic_remediation_cases.json --report /tmp/generated-report.md
